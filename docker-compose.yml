version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gin_gonic_learn
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gin_gonic_learn
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gin_gonic_learn_network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gin_gonic_learn_api
    environment:
      APP_NAME: "Gin Gonic Learn"
      APP_ENV: production
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: gin_gonic_learn
      DB_SSL_MODE: disable
      DB_TIMEZONE: Asia/Jakarta
      JWT_SECRET: your-secret-key-change-this-in-production
      JWT_EXPIRE_HOURS: 24
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - gin_gonic_learn_network
    restart: unless-stopped

networks:
  gin_gonic_learn_network:
    driver: bridge

volumes:
  postgres_data:
